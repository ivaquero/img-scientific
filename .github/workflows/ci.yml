name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python (contract + smoke render)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Spec-contract tests (static, no plotting imports needed)
        run: pytest -v

      - name: CLI discovery smoke
        run: imgsci list

      - name: Render one chart end-to-end (exercises save + figure close)
        run: python -c "from img_scientific import _render; p = _render.render('distrib/geom_pmf'); print('rendered', p)"

  julia:
    name: Julia (spec <-> register! contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "lts"

      - name: Static contract check (stdlib TOML only, no plotting packages)
        run: julia tests/julia_contract/verify.jl
