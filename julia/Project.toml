name = "ImgScientificJulia"
uuid = "4c1f7d9a-2b6e-4c17-9a3d-7e5b1c0d8f22"
authors = ["Xavier Yang <https://github.com/ivaquero>"]
version = "0.1.0"

# Julia renderer for the img-scientific teaching toolkit.
#
# Plotting stack = the Makie.jl ecosystem:
#   * CairoMakie   -- headless backend; re-exports Makie, so the statistical
#                     charts use the plain Makie API (bar!/lines!/band!/
#                     scatter!/contourf!/surface!/Axis3).
#   * GraphMakie   -- graph/network layouts via graphplot(), reserved for the
#                     future graphs/ topic (declared now so it is available then).
#   * Distributions -- analytic pmf/pdf/cdf behind those figures.
#
# Usage (from the julia/ directory):
#   ] instantiate           # resolve the Makie ecosystem from the registry
#   include("common.jl")    # then call ImgScientificJulia.render("distrib/geom_pmf")
#   include("runall.jl")    # render every spec that has a Julia impl

[deps]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
GraphMakie = "1ecd5474-83a3-4783-bb4f-06765db800d2"
Graphs = "86223c79-3864-5bf0-83f7-82e725a168b6"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"

[compat]
CairoMakie = "1"
Distributions = "0.25"
GraphMakie = "0.6"
Graphs = "1"
julia = "1.10"
