[project]
name = "img-scientific"
version = "0.1.0"
description = "Reproducible teaching plotting toolkit for statistics and graph-theory charts under different parameters"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ivaquero" }]
dependencies = [
  "matplotlib>=3.8",
  "networkx>=3.2",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.15.11",
]

# NOTE (P1): the `imgsci` console entry point will be added here as
# [project.scripts] -> "imgsci = img_scientific.cli:main"
# once img_scientific/cli.py is implemented. It is intentionally omitted in
# this P0 step so the package never advertises a command that does not yet exist.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["img_scientific"]

[tool.pyrefly]
search-path = ["img_scientific"]

[tool.ruff]
fix = true
target-version = "py310"
line-length = 88

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = [
  "DTZ",
  "E",
  "F",
  "I",
  "ISC",
  "NPY",
  "PERF",
  "RUF",
  "S",
  "SIM",
  "TID",
  "UP",
  "W",
]
fixable = ["ALL"]
ignore = [
  "E501",
  "ISC001",
  "RUF001",
  "RUF002",
  "RUF003",
  "S101",
  "S603",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true

[[tool.uv.index]]
url = "https://pypi.mirrors.ustc.edu.cn/simple"
default = true
