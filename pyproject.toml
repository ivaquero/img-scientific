[project]
name = "img-scientific"
version = "0.1.0"
description = "Reproducible teaching plotting toolkit for statistics and graph-theory charts under different parameters"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "ivaquero" }]
dependencies = [
  "matplotlib>=3.11",
  "networkx>=3.7",
  "numpy>=2.5",
  "scipy>=1.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2",
  "ruff>=0.17",
]

[project.scripts]
imgsci = "img_scientific.cli:main"

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["img_scientific"]

[tool.pyrefly]
search-path = ["img_scientific"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
fix = true
target-version = "py314"
line-length = 88

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = [
  "DTZ",
  "E",
  "F",
  "I",
  "ISC",
  "NPY",
  "PERF",
  "RUF",
  "S",
  "SIM",
  "TID",
  "UP",
  "W",
]
fixable = ["ALL"]
ignore = [
  "E501",
  "ISC001",
  "RUF001",
  "RUF002",
  "RUF003",
  "S101",
  "S603",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true

[[tool.uv.index]]
url = "https://pypi.mirrors.ustc.edu.cn/simple"
default = true
